            - cell "forwarding + signing proven" [ref=f1e355]
            - cell [ref=f1e357]:
              - text: "A local stub proves the whole call: GLM_UPSTREAM really redirects the destination (the source in the model id still picks the path), GLM_UPSTREAM_KEY rides as a bearer credential, x-signature is a real HMAC over the flattened prompt, the suffix features arrive in the reference projects' features shape, and one pool entry rides each call (check-chat.mjs). What is still unproven: a successful call to the real chat.z.ai / chatglm.cn, which needs a credential. The shape of that call — FE-version and region headers, account rotation on USER_BLOCKED with guest fallback — is what"
              - link "D3-vin / GLM-ZAI-2API" [ref=f1e358] [cursor=pointer]:
                - /url: repos.html#d3vin
              - text: got furthest with;
              - link "pingmike2 / zai2api" [ref=f1e359] [cursor=pointer]:
