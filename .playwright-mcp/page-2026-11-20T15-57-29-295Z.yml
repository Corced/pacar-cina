          - row [ref=f1e409]:
            - cell "Persistence" [ref=f1e410]
            - cell "directory on disk" [ref=f1e411]
            - 'cell "With GLM_STATE_FILE set, the people directory — created people, their roles and keys, and revocations — is a JSON file written on every change (0600) and reloaded on start, so a revoked key stays revoked across a restart. The pool, sessions and donation log stay in memory on purpose: pool entries are captcha params that expire in half an hour, so persisting them would be a liability rather than a feature." [ref=f1e413]'
          - row [ref=f1e414]:
            - cell "Endpoints listed above" [ref=f1e415]
            - cell "forward when configured" [ref=f1e416]
            - cell "/v1/models answers with the full catalog. /v1/chat/completions resolves the model id, spends one pool entry, signs the request and forwards to GLM_UPSTREAM; without it, 501 with its reason. No credential ships with the project, so forwarding is opt-in — and the forwarded call itself is proven against a stub, not the real upstream." [ref=f1e418]
