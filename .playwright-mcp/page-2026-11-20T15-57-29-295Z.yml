            - cell "keyed + revocable" [ref=f1e396]
            - 'cell "Admin, partner and superadmin sessions need that role''s key, compared in constant time; user is open on purpose. /status returns 401 without a session and 403 without an admin-level role. A person from GLM_PEOPLE can sign under their own name, and the seeded superadmin signs under its own. Every page also needs a session now: signed out, it redirects to login.html?next=…. Revocation and rotation are live: POST /people/revoke and POST /people/rotate take effect on the next request, and drop the person''s sessions and sockets." [ref=f1e398]'
          - row [ref=f1e399]:
