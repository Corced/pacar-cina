              - text: is the shorter Go version to read first.
          - row [ref=f1e360]:
            - cell "Partner token/session donation" [ref=f1e361]
            - cell "verified on arrival" [ref=f1e362]
            - cell "partner.html's form POSTs to the hub's /tokens endpoint (fingerprint + person + status, never the value). The hub now checks each donation against Aliyun as soon as it lands, so a status of valid or invalid comes from a real exchange and anything else settles as unverified rather than being claimed good. A minted param is what the chat path spends; donated values still stop at verified-and-recorded." [ref=f1e364]
          - row [ref=f1e365]:
            - cell "Per-person identity" [ref=f1e366]
            - cell "revocable at runtime" [ref=f1e367]
            - 'cell "GLM_PEOPLE (name=role:key) gives each person their own key; their name rides on sessions, mint sockets and donations, and /people lists the directory to admins. A superadmin is seeded at startup from GLM_SUPERADMIN (or a generated key printed once), creates people with POST /people and sees the key once. An admin revokes or rotates from the People card below: the key dies on the next request, and the person''s live sessions and open mint sockets are dropped with it. With GLM_STATE_FILE set the directory is a JSON file written on every change, so a revocation survives a restart. A key pinned in the environment refuses both actions on purpose." [ref=f1e369]'
          - row [ref=f1e370]:
            - cell "Real captcha mint" [ref=f1e371]
            - cell "unproven" [ref=f1e372]
            - cell [ref=f1e374]:
              - text: "glm-client.js now takes the scene from the hub's /config (env-driven, captured defaults) and loads the real SDK whenever a hub answers; with no hub it runs the labelled demo. The hub can exchange a param with Aliyun, but no real verification parameter has been produced here yet. Reference:"
              - link "chaoticmindv / zai2api" [ref=f1e375] [cursor=pointer]:
                - /url: repos.html#chaoticmindv
              - text: is the one to read here — it triggers the widget by sending a message and waits for the token to appear, which is the same browser path this project uses.
              - link "pingmike2" [ref=f1e376] [cursor=pointer]:
                - /url: repos.html#pingmike2
              - text: "shows the opposite choice: the whole captcha solved in-process (build args → track hash → compress → encrypt → verify), which needs no browser at all but breaks when Aliyun changes the challenge."
          - row [ref=f1e377]:
            - cell "Tor egress" [ref=f1e378]
            - cell "missing" [ref=f1e379]
            - cell [ref=f1e381]:
              - text: "Only a toggle exists. Needs a SOCKS5 client, circuit rotation and a policy for when to use it over direct. Reference: none of the three has Tor, so there is nothing to copy. The nearest pattern is"
              - link "D3-vin" [ref=f1e382] [cursor=pointer]:
                - /url: repos.html#d3vin
              - text: "'s WAF proxy rotation with a 10-minute dead-proxy timeout — the same bookkeeping (mark a route dead, stop using it, retry elsewhere) applies to circuits, and its proxy.txt one-address-per-line format is a sane shape for a circuit list."
          - row [ref=f1e383]:
            - cell "Token pool behaviour" [ref=f1e384]
            - cell "has a consumer" [ref=f1e385]
            - cell [ref=f1e387]:
              - text: "Entries carry an expiry, the sweep moves expired ones out (counted, never dropped silently), and the hub refills towards low-water and target. The chat path now takes an entry and spends it: the oldest minted param is attached to the upstream call as captcha_verify_param, a 401/403/429 returns it unspent, and the response carries x-glm-pool: spent|empty. An empty pool still forwards, labelled, rather than refusing. Reference:"
              - link "pingmike2 / zai2api" [ref=f1e388] [cursor=pointer]:
                - /url: repos.html#pingmike2
              - text: "'s queue discipline — ORDER BY id LIMIT 1, delete after use, refill below 50 — is the shape this now follows, minus SQLite: the hub's queue is memory."
          - row [ref=f1e389]:
