  - generic [ref=e132]:
    - heading "Sign-in options, honestly" [level=2] [ref=e133]
    - list [ref=e134]:
      - listitem [ref=e135]: A keyed session, no account. The hub checks the role's key in constant time, then issues a signed HttpOnly cookie. The role is granted by the key, not by you picking it — the admin key is the rule for who may claim admin.
      - listitem [ref=e136]: "Where the keys come from: the hub generates a random one per privileged role at startup and prints it, or you pin them with GLM_KEYS. Keys are per-role, not per-person — except the superadmin, which is seeded as one named account (GLM_SUPERADMIN)."
      - listitem [ref=e137]: Every page needs a session. Opening one while signed out redirects here; only this page and its styling stay public.
      - listitem [ref=e138]: "What is still missing: key rotation and revocation, and persistence — a restart rotates the generated keys and drops every session, though a superadmin pinned with GLM_SUPERADMIN survives."
      - listitem [ref=e139]: "Why it matters: the mint socket is refused without a session, and /status needs the admin role — so a stranger who reaches the port gets 401s, not the partner list or free mints."
